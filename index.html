<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habla con imágenes</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mut:#5b6475;--line:#d9d5ca;--acc:#1f5eff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1e2330;--ink:#eef0f6;--mut:#a3abbd;--line:#363d50;--acc:#6e96ff}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1e2330;--ink:#eef0f6;--mut:#a3abbd;--line:#363d50;--acc:#6e96ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Trebuchet MS",Verdana,sans-serif;font-size:18px}
header{padding:14px 16px 0;max-width:960px;margin:0 auto}
h1{font-size:1.4rem;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px;max-width:960px;margin:0 auto}
#frase{min-height:96px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px;background:var(--card);border:3px solid var(--acc);border-radius:16px}
#frase .vacio{color:var(--mut);padding:0 8px}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;width:84px;padding:6px 4px;border-radius:12px;border:3px solid var(--c);background:var(--card);touch-action:none;cursor:grab;user-select:none}
.chip.arrastrando{opacity:.5;transform:scale(1.08)}
.chip .e{font-size:2.2rem;line-height:1}
.chip .t{font-size:.8rem}
.chip button{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;cursor:pointer;padding:0}
.acciones{display:flex;gap:8px;margin-top:8px}
.btn{font:inherit;font-weight:700;padding:12px 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.play{background:var(--acc);border-color:var(--acc);color:#fff;flex:1}
.btn:focus-visible,.cat:focus-visible,.card:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;max-width:960px;margin:0 auto}
.cat{font:inherit;white-space:nowrap;padding:8px 14px;border-radius:999px;border:3px solid var(--c);background:var(--card);color:var(--ink);cursor:pointer}
.cat[aria-pressed="true"]{background:var(--c);color:#111;font-weight:700}
main{max-width:960px;margin:0 auto;padding:4px 16px 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tam,120px),1fr));gap:12px}
.card{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1;border-radius:16px;border:4px solid var(--c);background:var(--card);color:var(--ink);cursor:pointer}
.card:active{transform:scale(.95)}
.card .e{font-size:calc(var(--tam,120px)*.42);line-height:1}
.card .t{font-weight:700}
.ajuste{display:flex;align-items:center;gap:10px;margin-top:18px;color:var(--mut);font-size:.9rem}
.nota{color:var(--mut);font-size:.85rem;margin-top:10px}
</style>
</head>
<body>
<header><h1>Habla con imágenes</h1></header>
<div class="bar">
  <div id="frase" aria-live="polite"></div>
  <div class="acciones">
    <button class="btn play" id="play">▶ Decir frase</button>
    <button class="btn" id="borrar" aria-label="Borrar última palabra">⌫</button>
    <button class="btn" id="limpiar">Limpiar</button>
  </div>
</div>
<nav class="cats" id="cats" aria-label="Categorías"></nav>
<main>
  <div class="grid" id="grid"></div>
  <label class="ajuste">Tamaño de botones
    <input type="range" id="tam" min="90" max="190" value="120">
  </label>
  <p class="nota">Toca una imagen: suena la palabra y se agrega a la frase. Arrastra las tarjetas de la frase para cambiar el orden.</p>
</main>
<script>
const CATS=[
 {id:'personas',n:'Personas',c:'#f2c94c'},
 {id:'verbos',n:'Acciones',c:'#6fcf97'},
 {id:'cosas',n:'Cosas',c:'#f2994a'},
 {id:'describe',n:'Cómo estoy',c:'#56a8f5'},
 {id:'social',n:'Social',c:'#f48fb1'}];
const P=[
 ['yo','🙋','personas'],['tú','👉','personas'],['mamá','👩','personas'],['papá','👨','personas'],
 ['quiero','🤲','verbos'],['comer','🍽️','verbos'],['beber','🥤','verbos'],['jugar','🧸','verbos'],['ir','🚶','verbos'],
 ['agua','💧','cosas'],['pan','🍞','cosas'],['manzana','🍎','cosas'],['pelota','⚽','cosas'],['baño','🚽','cosas'],
 ['feliz','😀','describe'],['triste','😢','describe'],['cansado','😴','describe'],['dolor','🤕','describe'],
 ['sí','✅','social'],['no','❌','social'],['gracias','🙏','social'],['ayuda','🆘','social'],['más','➕','social'],['hola','👋','social']
].map((a,i)=>({id:i,t:a[0],e:a[1],cat:a[2]}));
const colorDe=c=>CATS.find(x=>x.id===c).c;
let cat='personas',frase=[];
const $=id=>document.getElementById(id);

// Voz: prioriza español de Chile, luego otros
let voz=null;
function elegirVoz(){
  const v=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith('es'));
  voz=v.find(x=>x.lang.replace('_','-')==='es-CL')||v.find(x=>/MX|US|419/.test(x.lang))||v[0]||null;
}
if('speechSynthesis' in window){elegirVoz();speechSynthesis.onvoiceschanged=elegirVoz}
function decir(txt){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=voz?voz.lang:'es-CL';if(voz)u.voice=voz;u.rate=.9;
  speechSynthesis.speak(u);
}

function pintaCats(){
  $('cats').innerHTML='';
  CATS.forEach(c=>{
    const b=document.createElement('button');
    b.className='cat';b.textContent=c.n;b.style.setProperty('--c',c.c);
    b.setAttribute('aria-pressed',c.id===cat);
    b.onclick=()=>{cat=c.id;pintaCats();pintaGrid()};
    $('cats').append(b);
  });
}
function pintaGrid(){
  $('grid').innerHTML='';
  P.filter(p=>p.cat===cat).forEach(p=>{
    const b=document.createElement('button');
    b.className='card';b.style.setProperty('--c',colorDe(p.cat));
    b.innerHTML=`<span class="e">${p.e}</span><span class="t">${p.t}</span>`;
    b.onclick=()=>{frase.push(p);decir(p.t);pintaFrase()};
    $('grid').append(b);
  });
}
function pintaFrase(){
  const f=$('frase');f.innerHTML='';
  if(!frase.length){f.innerHTML='<span class="vacio">Toca imágenes para armar tu frase</span>';return}
  frase.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='chip';d.dataset.i=i;d.style.setProperty('--c',colorDe(p.cat));
    d.innerHTML=`<span class="e">${p.e}</span><span class="t">${p.t}</span>`;
    const x=document.createElement('button');
    x.textContent='✕';x.setAttribute('aria-label','Quitar '+p.t);
    x.onpointerdown=e=>e.stopPropagation();
    x.onclick=()=>{frase.splice(i,1);pintaFrase()};
    d.append(x);
    d.onpointerdown=e=>arrastrar(e,d);
    f.append(d);
  });
}
// Arrastrar para reordenar (funciona con mouse y táctil)
function arrastrar(e,el){
  let i=+el.dataset.i,movio=false;
  el.setPointerCapture(e.pointerId);
  el.classList.add('arrastrando');
  el.onpointermove=ev=>{
    movio=true;
    const o=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.chip');
    if(o&&o!==el){
      const j=+o.dataset.i;
      const [m]=frase.splice(i,1);frase.splice(j,0,m);
      const chips=[...$('frase').children];
      const [a]=chips.splice(i,1);chips.splice(j,0,a);
      chips.forEach((c,k)=>{c.dataset.i=k;$('frase').append(c)});
      i=j;
    }
  };
  el.onpointerup=el.onpointercancel=()=>{
    el.classList.remove('arrastrando');
    el.onpointermove=el.onpointerup=el.onpointercancel=null;
    if(!movio)decir(frase[i].t);
    pintaFrase();
  };
}
$('play').onclick=()=>{if(frase.length)decir(frase.map(p=>p.t).join(' '))};
$('borrar').onclick=()=>{frase.pop();pintaFrase()};
$('limpiar').onclick=()=>{frase=[];pintaFrase()};
$('tam').oninput=e=>document.documentElement.style.setProperty('--tam',e.target.value+'px');
pintaCats();pintaGrid();pintaFrase();
</script>
</body>
</html>
